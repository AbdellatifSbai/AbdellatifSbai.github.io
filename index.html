<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="A simple personal website.">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 8vw, 4rem);
      border: 1px solid #e4e8f0;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 8%);
    }
    p { color: #596579; line-height: 1.7; }
    .eyebrow {
      color: #5263d9;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: .75rem 0; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -.05em; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little corner of the internet</p>
    <h1>Hello, world.</h1>
    <p>Welcome to my website. This is a simple starting point—more coming soon.</p>
  </main>
</body>
</html>
